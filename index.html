<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Отжимания • Дисциплина</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- PWA & iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Отжимания">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05060d">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='42' fill='%2305060d'/%3E%3Ccircle cx='90' cy='90' r='56' fill='none' stroke='rgba(255,255,255,0.08)' stroke-width='16'/%3E%3Ccircle cx='90' cy='90' r='56' fill='none' stroke='%23ffd23f' stroke-width='16' stroke-linecap='round' stroke-dasharray='352' stroke-dashoffset='88'/%3E%3Ccircle cx='90' cy='34' r='8' fill='%23ffd23f'/%3E%3Cpath d='M76 92 L86 102 L106 78' fill='none' stroke='%23ffffff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- Web Fonts (Inter & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05060d;
      --glass: rgba(16, 18, 34, 0.78);
      --glass-card: rgba(18, 22, 40, 0.74);
      --glass2: rgba(255, 255, 255, 0.06);
      --glass3: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.18);
      --ink: #eef0f6;
      --mute: #9aa1b8;
      --y: #ffd23f;
      --y-glow: rgba(255, 210, 63, 0.35);
      --ok: #7be38a;
      --ok-glow: rgba(123, 227, 138, 0.35);
      --bad: #ff6b81;
      --gem: #73eff7;
      --flame: #ff9d5c;
      color-scheme: dark;
    }

    [data-theme="light"] {
      --bg: #f2f4fa;
      --glass: rgba(255, 255, 255, 0.86);
      --glass-card: rgba(255, 255, 255, 0.92);
      --glass2: rgba(0, 0, 0, 0.04);
      --glass3: rgba(0, 0, 0, 0.02);
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.16);
      --ink: #121420;
      --mute: #6f768e;
      --y: #d49500;
      --y-glow: rgba(212, 149, 0, 0.25);
      --ok: #159b43;
      --ok-glow: rgba(21, 155, 67, 0.25);
      --bad: #e0314b;
      --gem: #088b99;
      --flame: #e65c00;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    }

    /* Фоновый холст с атмосферными микро-частицами */
    #stage {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ambient-radial {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--y-glow) 0%, rgba(5, 6, 13, 0) 70%);
      filter: blur(60px);
      opacity: 0.6;
      pointer-events: none;
      transition: background 0.8s ease, opacity 0.5s ease;
    }

    /* Стеклянные панели в стиле discipline-game */
    .glass {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 20px;
      -webkit-backdrop-filter: blur(16px) saturate(1.25);
      backdrop-filter: blur(16px) saturate(1.25);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    /* Центрированный мобильный контейнер приложения */
    .app-wrap {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      margin: 0 auto;
      padding: max(12px, env(safe-area-inset-top, 12px)) 14px max(24px, env(safe-area-inset-bottom, 20px));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Верхняя панель #info */
    #info {
      position: relative;
      padding: 16px 18px 14px;
      transition: transform 0.2s ease;
    }

    .info-header {
      padding-right: 90px;
    }

    #info h1 {
      margin: 0;
      font: 800 24px/1.15 Inter, sans-serif;
      letter-spacing: -0.02em;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #info h1 .logo-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--y);
      box-shadow: 0 0 10px var(--y);
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.75); opacity: 0.5; }
    }

    #sub {
      color: var(--mute);
      margin-top: 4px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clock {
      color: var(--y);
      margin-top: 3px;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .ibtns {
      position: absolute;
      right: 14px;
      top: 14px;
      display: flex;
      gap: 6px;
    }

    .ib {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--glass2);
      color: var(--y);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }

    .ib:active {
      transform: scale(0.9);
      background: var(--line);
    }

    .ib svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .ib.off {
      color: var(--mute);
      opacity: 0.65;
    }

    #info hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 12px 0 11px;
    }

    /* Статистические плашки .stats и .pill */
    .stats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 600 12.5px 'JetBrains Mono', monospace;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--glass2);
      color: var(--ink);
      cursor: default;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .pill.clickable {
      cursor: pointer;
    }

    .pill.clickable:active {
      transform: scale(0.93);
      border-color: var(--y);
    }

    .pill i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .pill.c b { color: var(--y); }
    .pill.g b { color: var(--gem); }
    .pill.f b { color: var(--flame); }
    .pill.ok b { color: var(--ok); }
    .pill small {
      color: var(--mute);
      font: 500 11.5px Inter, sans-serif;
      margin-left: 1px;
    }

    .bump {
      animation: bump 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes bump {
      40% { transform: scale(1.18); }
      70% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }

    /* Главная карточка с интерактивным кольцом активности */
    .hero-card {
      padding: 22px 18px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .ring-box {
      position: relative;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0 12px;
    }

    .ring-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: var(--glass2);
      stroke-width: 18;
    }

    .ring-bar {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 18;
      stroke-linecap: round;
      stroke-dasharray: 596.9;
      stroke-dashoffset: 596.9;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
      filter: drop-shadow(0 0 12px var(--y-glow));
    }

    .ring-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
    }

    .ring-num {
      font-size: 54px;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 0.95;
      color: var(--ink);
    }

    .ring-sub {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--mute);
      margin-top: 6px;
    }

    .ring-pct-badge {
      margin-top: 6px;
      font: 700 11px 'JetBrains Mono', monospace;
      color: var(--y);
      background: var(--glass2);
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
    }

    /* Трио показателей под кругом */
    .hero-triplet {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      margin-top: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .hero-stat-cell:not(:last-child) {
      border-right: 1px solid var(--line);
    }

    .hero-stat-val {
      font: 700 17px 'JetBrains Mono', monospace;
      color: var(--ink);
    }

    .hero-stat-lbl {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--mute);
      margin-top: 2px;
    }

    /* Карточка интервального таймера 5 минут */
    .timer-card {
      padding: 13px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.3s ease, background 0.3s ease;
    }

    .timer-card.active {
      border-color: rgba(255, 210, 63, 0.4);
      background: rgba(255, 210, 63, 0.04);
    }

    .timer-main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-left {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .timer-icon-wrap {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--glass2);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: transform 0.3s ease;
    }

    .timer-card.active .timer-icon-wrap {
      color: var(--y);
      border-color: var(--y);
      animation: bellShake 1.8s infinite ease-in-out;
    }

    @keyframes bellShake {
      0%, 100% { transform: rotate(0); }
      15% { transform: rotate(14deg); }
      30% { transform: rotate(-14deg); }
      45% { transform: rotate(8deg); }
      60% { transform: rotate(-4deg); }
    }

    .timer-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
    }

    .timer-desc {
      font-size: 12px;
      font-weight: 600;
      color: var(--mute);
      margin-top: 2px;
    }

    /* Стильный Discipline Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--glass2);
      border: 1px solid var(--line);
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 999px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: var(--mute);
      transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    .switch input:checked + .slider {
      background-color: var(--y);
      border-color: var(--y);
    }

    .switch input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #121420;
    }

    .shortcut-pill-btn {
      width: 100%;
      background: var(--glass2);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .shortcut-pill-btn:active {
      transform: scale(0.97);
      background: var(--line);
      border-color: var(--y);
    }

    .shortcut-pill-btn svg {
      color: var(--y);
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Блок добавления подходов: горизонтальный scroll chips или грид */
    .dock-bar {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .dock-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .sec-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--mute);
    }

    .undo-chip {
      background: none;
      border: 1px solid var(--line);
      color: var(--mute);
      font: 600 12px Inter, sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      transition: all 0.15s ease;
    }

    .undo-chip:not(:disabled):active {
      border-color: var(--bad);
      color: var(--bad);
      transform: scale(0.93);
    }

    .undo-chip:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .chips-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .chip-btn {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 13px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.15s ease, background 0.15s ease;
      color: var(--ink);
    }

    .chip-btn:active {
      transform: scale(0.9);
      border-color: var(--y);
      background: var(--glass2);
    }

    .chip-btn-num {
      font: 800 22px/1 'JetBrains Mono', monospace;
      color: var(--y);
      letter-spacing: -0.5px;
    }

    .chip-btn-sub {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--mute);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 3px;
    }

    .chip-btn.custom {
      border-style: dashed;
    }

    .chip-btn.custom svg {
      width: 18px;
      height: 18px;
      stroke: var(--ink);
      margin-bottom: 3px;
    }

    /* Сегментированный переключатель вкладок */
    .segmented {
      display: flex;
      background: var(--glass2);
      padding: 3px;
      border-radius: 14px;
      border: 1px solid var(--line);
      gap: 3px;
    }

    .seg-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 11px;
      border: 0;
      background: transparent;
      color: var(--mute);
      font: 600 13px Inter, sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .seg-btn.on {
      background: var(--glass);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    .seg-badge {
      font: 700 11px 'JetBrains Mono', monospace;
      background: var(--glass2);
      padding: 1px 6px;
      border-radius: 999px;
      color: var(--y);
    }

    /* Карточка со списком подходов и недельной матрицей */
    .list-card {
      padding: 0;
      overflow: hidden;
      max-height: 380px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line) transparent;
    }

    /* Недельная матрица в стиле discipline-game (Habit week table) */
    .week-table-wrap {
      padding: 14px 12px;
      overflow-x: auto;
    }

    .week-table {
      width: 100%;
      border-collapse: collapse;
      text-align: center;
    }

    .week-table th {
      font: 600 11px 'JetBrains Mono', monospace;
      color: var(--mute);
      padding: 5px 3px;
      text-transform: uppercase;
    }

    .week-table th.today {
      color: var(--y);
      font-weight: 800;
    }

    .week-table td {
      padding: 4px 2px;
    }

    .day-cell {
      width: 36px;
      height: 36px;
      margin: 0 auto;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--glass2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 700 12px 'JetBrains Mono', monospace;
      color: var(--mute);
      transition: all 0.2s ease;
    }

    .day-cell.done {
      background: var(--ok);
      border-color: var(--ok);
      color: #05060d;
      box-shadow: 0 0 12px var(--ok-glow);
    }

    .day-cell.done svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .day-cell.partial {
      border-color: var(--y);
      color: var(--y);
      background: rgba(255, 210, 63, 0.08);
    }

    .day-cell.current {
      box-shadow: inset 0 0 0 2px var(--y);
    }

    .day-cell-sub {
      font-size: 9px;
      line-height: 1;
      margin-top: 2px;
    }

    /* Строки сегодняшних подходов */
    .it-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--line);
      transition: background 0.15s ease;
      animation: rowSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes rowSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .it-row:first-child {
      border-top: 0;
    }

    .it-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .it-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--glass2);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 15px;
    }

    .it-num {
      font: 700 15px 'JetBrains Mono', monospace;
      color: var(--ink);
    }

    .it-time {
      font-size: 11.5px;
      color: var(--mute);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 1px;
    }

    .it-del-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 0;
      background: transparent;
      color: var(--mute);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: color 0.15s, transform 0.15s, background 0.15s;
    }

    .it-del-btn:active {
      color: var(--bad);
      background: rgba(255, 107, 129, 0.12);
      transform: scale(0.9);
    }

    .empty-box {
      padding: 38px 20px;
      text-align: center;
      color: var(--mute);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .empty-icon {
      font-size: 28px;
      opacity: 0.75;
    }

    /* Модальный диалог в стиле discipline-game (#dlg) */
    #dlg {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.65);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;

<body>

  <!-- Всплывающий тоаст уведомления (#toast) -->

    <span id="toastText">Готово!</span>

  <script>
    "use strict";

    (function() {
      // --- КЛЮЧИ ХРАНИЛИЩА ---
      const KEYS = {
        GOAL: 'pushups_goal_v2',
        LOGS: 'pushups_today_logs_v2',
        DATE: 'pushups_today_date_v2',
        HISTORY: 'pushups_history_v2',
        THEME: 'pushups_theme_v2',
        SOUND: 'pushups_sound_v2',
        TIMER_ACTIVE: 'pushups_timer_active_v2',
        TIMER_TARGET: 'pushups_timer_target_timestamp_v2'
      };

      const DAYS_SHORT = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
      const INTERVAL_MS = 5 * 60 * 1000;

      // --- СОСТОЯНИЕ ---
      let goal = parseInt(localStorage.getItem(KEYS.GOAL), 10) || 100;
      let logs = [];
      let history = {};
      let sound = localStorage.getItem(KEYS.SOUND) !== 'false';
      let theme = localStorage.getItem(KEYS.THEME) || 'dark';

      let isTimer = localStorage.getItem(KEYS.TIMER_ACTIVE) === 'true';
      let timerTarget = parseInt(localStorage.getItem(KEYS.TIMER_TARGET), 10) || null;
      let timerTimer = null;
      let wakeLock = null;

      let dispTotal = 0;
      let animFrame = null;

      const $ = id => document.getElementById(id);
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const pad = n => String(n).padStart(2, '0');

      // --- ВЕБ-АУДИО СИНТЕЗАТОР (8-BIT & RETRO SFX) ---
      let AC = null;
      function actx() {
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === 'suspended') AC.resume();
          return AC;
        } catch (e) {
          return null;
        }
      }

      function snd(seq) {
        if (!sound) return;
        const a = actx();
        if (!a) return;
        let t = a.currentTime;
        seq.forEach(([f, d, w = "square", v = 0.08]) => {
          const o = a.createOscillator();
          const g = a.createGain();
          o.type = w;
          o.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(v, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + d);
          o.connect(g).connect(a.destination);
          o.start(t);
          o.stop(t + d);
          t += d * 0.9;
        });
      }

      const SFX = {
        coin: () => snd([[988, 0.07, "square", 0.07], [1319, 0.16, "square", 0.09]]),
        undo: () => snd([[660, 0.07, "triangle", 0.08], [440, 0.14, "triangle", 0.08]]),
        fan: () => snd([[523, 0.1, "triangle", 0.1], [659, 0.1, "triangle", 0.1], [784, 0.1, "triangle", 0.1], [1047, 0.28, "square", 0.12]]),
        tick: () => snd([[1200, 0.03, "square", 0.04]]),
        no: () => snd([[180, 0.18, "sawtooth", 0.06]]),
        alarm: () => snd([[880, 0.12, "triangle", 0.12], [1174, 0.18, "triangle", 0.14]])
      };

      // --- ЛЕТЯЩИЕ ЧАСТИЦЫ (FLY) И ВСПЫШКА (BURST) ---
      function fly(fromEl, toId, col = "#ffd23f", n = 4) {
        if (!fromEl) return;
        const a = fromEl.getBoundingClientRect();
        const dest = $(toId);
        if (!dest) return;
        const b = dest.getBoundingClientRect();

        for (let i = 0; i < n; i++) {
          const e = document.createElement("i");
          e.className = "fly";
          e.style.background = col;
          e.style.color = col;
          e.style.left = (a.left + a.width / 2 - 5 + (i - (n - 1) / 2) * 6) + "px";
          e.style.top = (a.top + a.height / 2 - 5) + "px";
          document.body.appendChild(e);

          setTimeout(() => {
            e.style.transform = `translate(${b.left + b.width / 2 - a.left - a.width / 2}px, ${b.top + b.height / 2 - a.top - a.height / 2}px) scale(0.6)`;
            e.style.opacity = "0.2";
          }, 20 + i * 50);

          setTimeout(() => {
            e.remove();
            dest.classList.remove("bump");
            void dest.offsetWidth;
            dest.classList.add("bump");
          }, 650 + i * 50);
        }
      }

      function burst(n = 36) {
        const colors = ["#ffd23f", "#73eff7", "#7be38a", "#ff9d5c", "#ffffff"];
        for (let i = 0; i < n; i++) {
          const e = document.createElement("i");
          e.className = "fly";
          const c = colors[i % colors.length];
          e.style.background = c;
          e.style.color = c;
          e.style.left = (innerWidth / 2) + "px";
          e.style.top = (innerHeight * 0.42) + "px";
          document.body.appendChild(e);

          requestAnimationFrame(() => {
            const angle = Math.random() * Math.PI * 2;
            const dist = (Math.random() * 0.4 + 0.15) * Math.min(innerWidth, innerHeight);
            const tx = Math.cos(angle) * dist;
            const ty = Math.sin(angle) * dist - 20;
            e.style.transform = `translate(${tx}px, ${ty}px) rotate(${Math.random() * 360}deg) scale(0.4)`;
            e.style.opacity = "0";
          });

          setTimeout(() => e.remove(), 700);
        }
      }

      // --- ХОЛСТ С АТМОСФЕРНЫМИ МИКРО-ЧАСТИЦАМИ (STAGE CANVAS) ---
      const bgCanvas = $("bgCanvas");
      const bgCtx = bgCanvas.getContext("2d");
      let motes = [];

      function initMotes() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        bgCanvas.width = innerWidth * dpr;
        bgCanvas.height = innerHeight * dpr;
        motes = [];
        const count = Math.floor(innerWidth / 18);
        for (let i = 0; i < count; i++) {
          motes.push({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            size: (Math.random() * 2 + 1) * dpr,
            vx: (Math.random() - 0.5) * 0.35 * dpr,
            vy: (Math.random() * -0.45 - 0.15) * dpr,
            alpha: Math.random() * 0.5 + 0.2,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function drawMotes(time) {
        bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
        const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
        const pColor = isDark ? "255, 210, 63" : "212, 149, 0";

        motes.forEach(m => {
          m.x += m.vx;
          m.y += m.vy;
          if (m.y < 0) {
            m.y = bgCanvas.height;
            m.x = Math.random() * bgCanvas.width;
          }
          if (m.x < 0) m.x = bgCanvas.width;
          if (m.x > bgCanvas.width) m.x = 0;

          const a = m.alpha * (0.6 + 0.4 * Math.sin(time * 0.002 + m.phase));
          bgCtx.fillStyle = `rgba(${pColor}, ${a})`;
          bgCtx.fillRect(m.x, m.y, m.size, m.size);
        });
        requestAnimationFrame(drawMotes);
      }

      window.addEventListener("resize", initMotes);
      initMotes();
      requestAnimationFrame(drawMotes);

      // --- ТОАСТ (#toast) ---
      let toastTimer = null;
      function toast(msg, showPlus10 = false) {
        const t = $("toast");
        $("toastText").textContent = msg;
        const act = $("toastAct");
        act.style.display = showPlus10 ? "inline-block" : "none";
        t.classList.add("on");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove("on"), showPlus10 ? 5500 : 2500);
      }

      $("toastAct").onclick = () => {
        addReps(10, $("toastAct"));
        $("toast").classList.remove("on");
      };

      // --- МОДАЛЬНОЕ ОКНО (#dlg) ---
      function openDlg(html) {
        $("dc").innerHTML = html;
        $("dlg").classList.add("on");
      }

      function closeDlg() {
        $("dlg").classList.remove("on");
        $("dc").innerHTML = "";
      }

      $("dx").onclick = closeDlg;
      $("dlg").onclick = e => {
        if (e.target === $("dlg")) closeDlg();
      };

      // --- ДАТЫ И КАЛЕНДАРЬ ---
      const todayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

      function getMondayDate(d = new Date()) {
        const day = (d.getDay() + 6) % 7;
        const res = new Date(d);
        res.setDate(d.getDate() - day);
        res.setHours(0, 0, 0, 0);
        return res;
      }

      function updateClock() {
        const d = new Date();
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        const dayIdx = (d.getDay() + 6) % 7;
        const dayName = DAYS_SHORT[dayIdx];
        $("clock").textContent = `${timeStr} • ${dayName}`;
      }
      setInterval(updateClock, 1000);
      updateClock();

      function rotateDayIfNeeded() {
        const storedDate = localStorage.getItem(KEYS.DATE);
        const curDate = todayKey();

        try {
          history = JSON.parse(localStorage.getItem(KEYS.HISTORY)) || {};
        } catch (e) {
          history = {};
        }

        if (storedDate && storedDate !== curDate) {
          let prevLogs = [];
          try {
            prevLogs = JSON.parse(localStorage.getItem(KEYS.LOGS)) || [];
          } catch (e) {}

          const prevTotal = prevLogs.reduce((s, it) => s + (it.count || 0), 0);
          if (prevTotal > 0 || prevLogs.length > 0) {
            history[storedDate] = {
              total: prevTotal,
              goal: goal,
              goalReached: prevTotal >= goal
            };
            localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));
          }

          logs = [];
          localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
          localStorage.setItem(KEYS.DATE, curDate);
        } else if (!storedDate) {
          localStorage.setItem(KEYS.DATE, curDate);
          logs = JSON.parse(localStorage.getItem(KEYS.LOGS) || "[]");
        } else {
          logs = JSON.parse(localStorage.getItem(KEYS.LOGS) || "[]");
        }
      }

      function getTodayTotal() {
        return logs.reduce((sum, item) => sum + (item.count || 0), 0);
      }

      // --- ПЛАВНАЯ АНИМАЦИЯ ЦИФР ---
      function animateHeroNumber(target) {
        cancelAnimationFrame(animFrame);
        const start = dispTotal;
        const startTime = performance.now();
        const dur = 450;

        function step(now) {
          const p = Math.min((now - startTime) / dur, 1);
          const ease = 1 - Math.pow(1 - p, 3);
          dispTotal = Math.round(start + (target - start) * ease);
          $("heroRingNum").textContent = dispTotal;
          if (p < 1) animFrame = requestAnimationFrame(step);
          else {
            dispTotal = target;
            $("heroRingNum").textContent = target;
          }
        }
        animFrame = requestAnimationFrame(step);
      }

      // --- ОСНОВНОЙ РЕНДЕР ИНТЕРФЕЙСА ---
      const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 95;

      function render(animate = true) {
        const total = getTodayTotal();
        const sets = logs.length;
        const rem = Math.max(goal - total, 0);
        const avg = sets > 0 ? Math.round(total / sets) : 0;
        const pct = goal > 0 ? Math.round((total / goal) * 100) : 0;

        if (animate) animateHeroNumber(total);
        else {
          dispTotal = total;
          $("heroRingNum").textContent = total;
        }

        // Обновление капсул и HUD
        $("vBal").textContent = total;
        $("vSt").textContent = sets;
        $("vRem").textContent = rem;
        $("vGoal").textContent = goal;
        $("heroPctBadge").textContent = `${pct}%`;

        $("statRemaining").textContent = rem;
        $("statSets").textContent = sets;
        $("statAvg").textContent = avg;
        $("badgeToday").textContent = sets;
        $("undoBtn").disabled = sets === 0;

        // Кольцо прогресса
        const ratio = goal > 0 ? Math.min(total / goal, 1) : 0;
        const offset = CIRCLE_CIRCUMFERENCE - (ratio * CIRCLE_CIRCUMFERENCE);
        $("ringBar").style.strokeDashoffset = offset;

        // Неоновые градиенты при выполнении нормы
        if (total >= goal) {
          $("grad1").setAttribute("stop-color", "var(--ok)");
          $("grad2").setAttribute("stop-color", "var(--gem)");
          $("ambientRadial").style.background = "radial-gradient(circle, var(--ok-glow) 0%, rgba(5,6,13,0) 70%)";
        } else {
          $("grad1").setAttribute("stop-color", "var(--y)");
          $("grad2").setAttribute("stop-color", "var(--flame)");
          $("ambientRadial").style.background = "radial-gradient(circle, var(--y-glow) 0%, rgba(5,6,13,0) 70%)";
        }

        renderTodayList();
        renderWeekTable();
        renderHistoryList();
      }

      // --- СПИСОК ПОДХОДОВ ЗА СЕГОДНЯ ---
      function renderTodayList() {
        const el = $("listToday");
        if (logs.length === 0) {
          el.innerHTML = `
            <div class="empty-box">
              <span class="empty-icon">⚡</span>
              <span>Подходов сегодня пока нет.<br>Нажми любую кнопку выше, чтобы сделать первый сет!</span>
            </div>
          `;
          return;
        }

        const itemsHtml = logs.slice().reverse().map(it => `
          <div class="it-row">
            <div class="it-left">
              <div class="it-icon">💪</div>
              <div>
                <div class="it-num">+${it.count} раз</div>
                <div class="it-time">${it.time}</div>
              </div>
            </div>
            <button class="it-del-btn" data-del="${it.id}" title="Удалить этот подход" aria-label="Удалить">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M3 4l1-1 4 4 4-4 1 1-4 4 4 4-1 1-4-4-4 4-1-1 4-4z"/></svg>
            </button>
          </div>
        `).join('');

        el.innerHTML = itemsHtml;
        el.querySelectorAll("[data-del]").forEach(btn => {
          btn.onclick = () => {
            const id = btn.dataset.del;
            logs = logs.filter(x => String(x.id) !== id);
            localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
            SFX.undo();
            render(true);
          };
        });
      }

      // --- НЕДЕЛЬНАЯ МАТРИЦА (HABIT MATRIX КАК В DISCIPLINE GAME) ---
      function renderWeekTable() {
        const mon = getMondayDate();
        const curIdx = (new Date().getDay() + 6) % 7;
        let thHtml = '';
        let tdHtml = '';

        for (let i = 0; i < 7; i++) {
          const d = new Date(mon);
          d.setDate(mon.getDate() + i);
          const key = todayKey(d);
          const isToday = i === curIdx;

          let count = 0;
          let isDone = false;
          let isPartial = false;

          if (isToday) {
            count = getTodayTotal();
            isDone = count >= goal;
            isPartial = count > 0 && !isDone;
          } else if (history[key]) {
            count = history[key].total || 0;
            const target = history[key].goal || goal;
            isDone = count >= target;
            isPartial = count > 0 && !isDone;
          }

          thHtml += `<th class="${isToday ? 'today' : ''}">${DAYS_SHORT[i]}</th>`;
          tdHtml += `
            <td>
              <div class="day-cell ${isDone ? 'done' : isPartial ? 'partial' : ''} ${isToday ? 'current' : ''}" title="${key}: ${count} отжиманий">
                ${isDone ? '<svg viewBox="0 0 16 16"><path d="M2 8l2-2 3 3 5-6 2 2-7 8z"/></svg>' : (count > 0 ? count : '-')}
                ${isToday && !isDone ? '<span class="day-cell-sub">СЕГ</span>' : ''}
              </div>
            </td>
          `;
        }

        $("weekHead").innerHTML = thHtml;
        $("weekCells").innerHTML = tdHtml;
      }

      // --- ИСТОРИЯ ПРОШЛЫХ ДНЕЙ ---
      function renderHistoryList() {
        const el = $("listHistory");
        const days = Object.keys(history).sort().reverse();
        if (days.length === 0) {
          el.innerHTML = `
            <div class="empty-box" style="padding:22px 14px;">
              <span class="empty-icon">📅</span>
              <span>История дней появится здесь автоматически при смене суток.</span>
            </div>
          `;
          return;
        }

        const rows = days.slice(0, 14).map(k => {
          const it = history[k];
          const [y, m, d] = k.split('-');
          const dateObj = new Date(y, m - 1, d);
          const dateTitle = dateObj.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', weekday: 'short' });
          const target = it.goal || goal;
          const isDone = it.total >= target;

          return `
            <div class="it-row">
              <div class="it-left">
                <div class="it-icon">${isDone ? '🏆' : '🎯'}</div>
                <div>
                  <div class="it-num">${it.total} <small style="font-size:12px;color:var(--mute)">/ ${target}</small></div>
                  <div class="it-time">${dateTitle}</div>
                </div>
              </div>
              <span class="pill ${isDone ? 'ok' : ''}">
                <i style="background:${isDone ? 'var(--ok)' : 'var(--mute)'}"></i>
                <b>${isDone ? 'ВЫПОЛНЕНО' : `${Math.round((it.total/target)*100)}%`}</b>
              </span>
            </div>
          `;
        }).join('');

        el.innerHTML = rows;
      }

      // --- ДОБАВЛЕНИЕ ПОДХОДА ---
      function addReps(n, btnEl) {
        if (!n || n <= 0) return;
        const prev = getTodayTotal();
        const d = new Date();
        const timeStr = `${pad(d.getHours())}:${pad(d.getMinutes())}`;

        const item = {
          id: Date.now() + Math.random().toString(36).substr(2, 4),
          count: n,
          time: timeStr,
          timestamp: Date.now()
        };

        logs.push(item);
        localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));

        // Эффекты
        if (btnEl) fly(btnEl, "pBal", "#ffd23f", Math.min(n, 5));
        SFX.coin();

        // Сброс интервала таймера на 5 минут вперед
        if (isTimer) {
          timerTarget = Date.now() + INTERVAL_MS;
          localStorage.setItem(KEYS.TIMER_TARGET, timerTarget);
          updateTimerUI();
        }

        render(true);

        const cur = getTodayTotal();
        if (prev < goal && cur >= goal) {
          setTimeout(() => {
            SFX.fan();
            burst(48);
            toast(`🏆 ЦЕЛЬ В ${goal} ОТЖИМАНИЙ ЗАКРЫТА!`);
          }, 350);
        } else {
          toast(`+${n} отжиманий добавлено!`);
        }
      }

      function undoLast() {
        if (logs.length === 0) return;
        logs.pop();
        localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
        SFX.undo();
        render(true);
        toast("Последний подход отменен");
      }

      // Слушатели кнопок добавления
      document.querySelectorAll("[data-add]").forEach(btn => {
        btn.onclick = () => addReps(parseInt(btn.dataset.add, 10), btn);
      });

      $("undoBtn").onclick = undoLast;

      // --- МОДАЛКИ (СВОЙ ВВОД & ИЗМЕНЕНИЕ ЦЕЛИ) ---
      $("customBtn").onclick = () => {
        openDlg(`
          <h2>Свой ввод</h2>
          <p class="dlg-desc">Сколько отжиманий ты только что сделал?</p>
          <div class="ed">
            <input class="n mono" id="inpCustom" type="number" min="1" max="500" placeholder="Например: 35" autofocus>
          </div>
          <div class="row" style="margin-top:14px; justify-content: flex-end;">
            <button class="b sm" id="btnCustomCancel">Отмена</button>
            <button class="b sm g" id="btnCustomDone">Записать</button>
          </div>
        `);

        setTimeout(() => $("inpCustom") && $("inpCustom").focus(), 80);

        const submit = () => {
          const v = parseInt($("inpCustom").value, 10);
          if (v > 0) {
            closeDlg();
            addReps(v, $("customBtn"));
          } else {
            $("inpCustom").focus();
          }
        };

        $("btnCustomDone").onclick = submit;
        $("btnCustomCancel").onclick = closeDlg;
        $("inpCustom").onkeydown = e => { if (e.key === 'Enter') submit(); };
      };

      $("pGoal").onclick = () => {
        openDlg(`
          <h2>Дневная цель</h2>
          <p class="dlg-desc">Укажи количество отжиманий на день:</p>
          <div class="ed">
            <input class="n mono" id="inpGoal" type="number" min="1" max="2000" value="${goal}">
          </div>
          <div class="row" style="margin-top:14px; justify-content: flex-end;">
            <button class="b sm" id="btnGoalCancel">Отмена</button>
            <button class="b sm g" id="btnGoalDone">Сохранить</button>
          </div>
        `);

        setTimeout(() => $("inpGoal") && $("inpGoal").focus(), 80);

        const submit = () => {
          const v = parseInt($("inpGoal").value, 10);
          if (v > 0) {
            goal = v;
            localStorage.setItem(KEYS.GOAL, String(goal));
            SFX.tick();
            closeDlg();
            render(false);
            toast(`Новая цель: ${goal} раз`);
          }
        };

        $("btnGoalDone").onclick = submit;
        $("btnGoalCancel").onclick = closeDlg;
        $("inpGoal").onkeydown = e => { if (e.key === 'Enter') submit(); };
      };

      // Клик по балансу: быстрый выбор
      $("pBal").onclick = () => {
        SFX.tick();
        fly($("pBal"), "pBal", "#ffd23f", 3);
      };

      // --- ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК (СЕГОДНЯ / НЕДЕЛЯ) ---
      $("tabToday").onclick = () => {
        SFX.tick();
        $("tabToday").classList.add("on");
        $("tabWeek").classList.remove("on");
        $("boxToday").style.display = "block";
        $("boxWeek").style.display = "none";
      };

      $("tabWeek").onclick = () => {
        SFX.tick();
        $("tabWeek").classList.add("on");
        $("tabToday").classList.remove("on");
        $("boxToday").style.display = "none";
        $("boxWeek").style.display = "block";
      };

      // --- ИНТЕРВАЛЬНЫЙ ТАЙМЕР (5 МИНУТ) ---
      async function reqWakeLock() {
        try {
          if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {}
      }

      function relWakeLock() {
        if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
        }
      }

      function sendPushNotification(title, body) {
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification(title, { body });
          } catch (e) {}
        }
      }

      function formatSec(s) {
        return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
      }

      function onTimerAlarm() {
        SFX.alarm();
        sendPushNotification("Время отжаться! 🔥", "Сделай 10 отжиманий прямо сейчас!");
        toast("🔔 Пора сделать 10 отжиманий!", true);

        const now = Date.now();
        while (!timerTarget || timerTarget <= now) {
          timerTarget = (timerTarget || now) + INTERVAL_MS;
        }
        localStorage.setItem(KEYS.TIMER_TARGET, timerTarget);
        updateTimerUI();
      }

      function updateTimerUI() {
        if (!isTimer || !timerTarget) return;
        const now = Date.now();
        const diff = timerTarget - now;
        if (diff <= 0) {
          onTimerAlarm();
        } else {
          $("timerStatus").textContent = `До подхода: ${formatSec(Math.ceil(diff / 1000))}`;
        }
      }

      function startTimer(isManual = false) {
        isTimer = true;
        localStorage.setItem(KEYS.TIMER_ACTIVE, 'true');
        $("intervalToggle").checked = true;
        $("timerCard").classList.add("active");

        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
        reqWakeLock();

        const now = Date.now();
        if (isManual || !timerTarget) {
          timerTarget = now + INTERVAL_MS;
          localStorage.setItem(KEYS.TIMER_TARGET, timerTarget);
          toast("⏰ Таймер включен: каждые 5 мин");
        } else if (timerTarget <= now) {
          onTimerAlarm();
        }

        clearInterval(timerTimer);
        updateTimerUI();
        timerTimer = setInterval(updateTimerUI, 1000);
      }

      function stopTimer() {
        isTimer = false;
        timerTarget = null;
        localStorage.setItem(KEYS.TIMER_ACTIVE, 'false');
        localStorage.removeItem(KEYS.TIMER_TARGET);

        $("intervalToggle").checked = false;
        $("timerCard").classList.remove("active");
        clearInterval(timerTimer);
        timerTimer = null;
        $("timerStatus").textContent = "Напоминание сделать 10 раз";
        relWakeLock();
        toast("Таймер отключен");
      }

      $("intervalToggle").onchange = () => {
        SFX.tick();
        if ($("intervalToggle").checked) startTimer(true);
        else stopTimer();
      };

      $("shortcutBtn").onclick = () => {
        SFX.tick();
        if (!isTimer) startTimer(true);
        else {
          timerTarget = Date.now() + INTERVAL_MS;
          localStorage.setItem(KEYS.TIMER_TARGET, timerTarget);
          updateTimerUI();
        }
        toast("Команда iOS «Отжимания» запущена!");
      };

      // --- ТЕМА И ЗВУКИ (#info btns) ---
      function applyTheme(t) {
        theme = t;
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(KEYS.THEME, theme);
      }

      $("themeBtn").onclick = () => {
        SFX.tick();
        const next = (theme === 'dark') ? 'light' : 'dark';
        applyTheme(next);
      };

      $("snd").onclick = () => {
        sound = !sound;
        localStorage.setItem(KEYS.SOUND, String(sound));
        $("snd").classList.toggle("off", !sound);
        if (sound) SFX.tick();
      };

      if (!sound) $("snd").classList.add("off");
      applyTheme(theme);

      // --- МЕНЮ НАСТРОЕК И БЭКАПА (#menu КАК В DISCIPLINE GAME) ---
      $("menu").onclick = () => {
        SFX.tick();
        const fullData = {
          goal,
          logs,
          history,
          date: localStorage.getItem(KEYS.DATE)
        };

        openDlg(`
          <h2>Дисциплина</h2>
          <p class="dlg-desc">Управление целями, бэкапом и данными тренировок.</p>

          <h3>Цель тренировок</h3>
          <div class="ed">
            <input class="s mono" id="mGoal" type="number" min="10" max="1000" value="${goal}">
            <span style="font-size:13px; color:var(--mute)">отжиманий в день</span>
          </div>

          <h3>Резервная копия (JSON)</h3>
          <p class="dlg-desc" style="font-size:12px;">Скопируй код для переноса на другое устройство или вставь сохраненный код для восстановления:</p>
          <textarea class="code-box" id="backupCode" rows="4" aria-label="JSON">${JSON.stringify(fullData)}</textarea>

          <div class="row" style="margin-top:8px;">
            <button class="b sm g" id="btnCopyBackup">Скопировать</button>
            <button class="b sm ok" id="btnRestoreBackup">Загрузить</button>
          </div>

          <h3>Очистить данные</h3>
          <div class="row">
            <button class="b sm r" id="btnResetToday">Сбросить сегодня</button>
            <button class="b sm r" id="btnResetAll">Сбросить всё</button>
          </div>
        `);

        $("mGoal").onchange = e => {
          const v = parseInt(e.target.value, 10);
          if (v > 0) {
            goal = v;
            localStorage.setItem(KEYS.GOAL, String(goal));
            render(false);
          }
        };

        $("btnCopyBackup").onclick = () => {
          $("backupCode").select();
          try {
            navigator.clipboard.writeText($("backupCode").value).then(() => {
              SFX.tick();
              toast("Код скопирован в буфер!");
            });
          } catch (err) {
            toast("Выделите и скопируйте текст");
          }
        };

        $("btnRestoreBackup").onclick = () => {
          try {
            const parsed = JSON.parse($("backupCode").value);
            if (typeof parsed.goal === 'number') goal = parsed.goal;
            if (Array.isArray(parsed.logs)) logs = parsed.logs;
            if (parsed.history && typeof parsed.history === 'object') history = parsed.history;

            localStorage.setItem(KEYS.GOAL, String(goal));
            localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
            localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));

            SFX.fan();
            closeDlg();
            render(false);
            toast("Данные успешно восстановлены!");
          } catch (e) {
            SFX.no();
            toast("Ошибка в формате JSON!");
          }
        };

        $("btnResetToday").onclick = () => {
          if (confirm("Точно сбросить сегодняшние подходы?")) {
            logs = [];
            localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
            SFX.undo();
            closeDlg();
            render(true);
            toast("Сегодняшние подходы очищены");
          }
        };

        $("btnResetAll").onclick = () => {
          if (confirm("Внимание: это действие сотрет всю историю и подходы! Продолжить?")) {
            logs = [];
            history = {};
            localStorage.setItem(KEYS.LOGS, JSON.stringify(logs));
            localStorage.setItem(KEYS.HISTORY, JSON.stringify(history));
            SFX.no();
            closeDlg();
            render(true);
            toast("Все данные сброшены");
          }
        };
      };

      // --- ВОЗВРАЩЕНИЕ НА ЭКРАН ---
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          rotateDayIfNeeded();
          render(false);
          if (isTimer) {
            updateTimerUI();
            reqWakeLock();
          }
        }
      });

      // --- СТАРТ ---
      rotateDayIfNeeded();
      render(false);

      if (isTimer) {
        startTimer();
      }

    })();
  </script>
</body>
</html>
